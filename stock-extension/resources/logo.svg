<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="up" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="down" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <linearGradient id="ma" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <clipPath id="round">
      <rect width="512" height="512" rx="96"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Decorative grid -->
  <g clip-path="url(#round)" opacity="0.05" stroke="#fff" stroke-width="1">
    <line x1="0" y1="128" x2="512" y2="128"/><line x1="0" y1="256" x2="512" y2="256"/><line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/><line x1="256" y1="0" x2="256" y2="512"/><line x1="384" y1="0" x2="384" y2="512"/>
  </g>

  <!-- Ambient glow blobs -->
  <circle cx="120" cy="120" r="160" fill="#EF4444" opacity="0.08"/>
  <circle cx="400" cy="400" r="180" fill="#F59E0B" opacity="0.06"/>

  <!-- Main chart -->
  <g filter="url(#shadow)">
    <!-- Candle 1 (down) -->
    <rect x="48" y="200" width="34" height="110" rx="5" fill="url(#down)"/>
    <line x1="65" y1="160" x2="65" y2="320" stroke="#4ADE80" stroke-width="4" stroke-linecap="round"/>
    <!-- Candle 2 (up) -->
    <rect x="118" y="220" width="34" height="90" rx="5" fill="url(#up)"/>
    <line x1="135" y1="180" x2="135" y2="320" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
    <!-- Candle 3 (down) -->
    <rect x="188" y="170" width="34" height="140" rx="5" fill="url(#down)"/>
    <line x1="205" y1="130" x2="205" y2="320" stroke="#4ADE80" stroke-width="4" stroke-linecap="round"/>
    <!-- Candle 4 (up) -->
    <rect x="258" y="150" width="34" height="160" rx="5" fill="url(#up)"/>
    <line x1="275" y1="110" x2="275" y2="320" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
    <!-- Candle 5 (down) -->
    <rect x="328" y="210" width="34" height="100" rx="5" fill="url(#down)"/>
    <line x1="345" y1="180" x2="345" y2="320" stroke="#4ADE80" stroke-width="4" stroke-linecap="round"/>
    <!-- Candle 6 (up, breakout) -->
    <rect x="398" y="120" width="34" height="190" rx="5" fill="url(#up)"/>
    <line x1="415" y1="80" x2="415" y2="320" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- MA trend line with glow -->
  <g filter="url(#glow)">
    <polyline points="65,270 135,255 205,210 275,180 345,240 415,160"
      fill="none" stroke="url(#ma)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Volume bars -->
  <g opacity="0.55">
    <rect x="48" y="350" width="34" height="50" rx="5" fill="#F87171"/>
    <rect x="118" y="360" width="34" height="40" rx="5" fill="#F87171"/>
    <rect x="188" y="345" width="34" height="55" rx="5" fill="#4ADE80"/>
    <rect x="258" y="335" width="34" height="65" rx="5" fill="#F87171"/>
    <rect x="328" y="365" width="34" height="35" rx="5" fill="#4ADE80"/>
    <rect x="398" y="330" width="34" height="70" rx="5" fill="#F87171"/>
  </g>

  <!-- Rising arrow accent (top-right) -->
  <g filter="url(#glow)" opacity="0.9">
    <path d="M420 150 L455 95 L490 60 M455 95 L485 96 M455 95 L456 65"
      stroke="url(#arrow)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Brand text -->
  <text x="256" y="450" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="62" fill="#fff" letter-spacing="3">StockExt</text>
  <text x="256" y="488" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="400" font-size="20" fill="#94A3B8" letter-spacing="8">A-SHARE TRACKER</text>
</svg>
