<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="50%" stop-color="#5A67D8"/>
      <stop offset="100%" stop-color="#4C51BF"/>
    </linearGradient>
    <linearGradient id="up" x1="0" y1="1" x2="0" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#F56565"/>
      <stop offset="100%" stop-color="#FC8181"/>
    </linearGradient>
    <linearGradient id="down" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#48BB78"/>
      <stop offset="100%" stop-color="#68D391"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ECC94B"/>
      <stop offset="100%" stop-color="#F6E05E"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Grid -->
  <g opacity="0.06" stroke="#fff" stroke-width="1">
    <line x1="0" y1="128" x2="512" y2="128"/><line x1="0" y1="256" x2="512" y2="256"/><line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/><line x1="256" y1="0" x2="256" y2="512"/><line x1="384" y1="0" x2="384" y2="512"/>
  </g>
  <!-- Main chart group -->
  <g filter="url(#shadow)">
    <!-- Candle 1 (down) -->
    <rect x="56" y="180" width="32" height="110" rx="4" fill="url(#down)"/>
    <line x1="72" y1="140" x2="72" y2="300" stroke="#48BB78" stroke-width="4" stroke-linecap="round"/>
    <!-- Candle 2 (up) -->
    <rect x="116" y="200" width="32" height="90" rx="4" fill="url(#up)"/>
    <line x1="132" y1="160" x2="132" y2="300" stroke="#F56565" stroke-width="4" stroke-linecap="round"/>
    <!-- Candle 3 (down) -->
    <rect x="176" y="150" width="32" height="130" rx="4" fill="url(#down)"/>
    <line x1="192" y1="110" x2="192" y2="300" stroke="#48BB78" stroke-width="4" stroke-linecap="round"/>
    <!-- Candle 4 (up) -->
    <rect x="236" y="170" width="32" height="110" rx="4" fill="url(#up)"/>
    <line x1="252" y1="130" x2="252" y2="300" stroke="#F56565" stroke-width="4" stroke-linecap="round"/>
    <!-- Candle 5 (down) -->
    <rect x="296" y="210" width="32" height="80" rx="4" fill="url(#down)"/>
    <line x1="312" y1="180" x2="312" y2="300" stroke="#48BB78" stroke-width="4" stroke-linecap="round"/>
    <!-- Candle 6 (up) -->
    <rect x="356" y="140" width="32" height="140" rx="4" fill="url(#up)"/>
    <line x1="372" y1="100" x2="372" y2="300" stroke="#F56565" stroke-width="4" stroke-linecap="round"/>
    <!-- Candle 7 (up, tall) -->
    <rect x="416" y="120" width="32" height="150" rx="4" fill="url(#up)"/>
    <line x1="432" y1="80" x2="432" y2="290" stroke="#F56565" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- MA line with glow -->
  <g filter="url(#glow)">
    <polyline points="72,230 132,245 192,190 252,210 312,250 372,175 432,160"
      fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Volume bars -->
  <g opacity="0.65">
    <rect x="56" y="330" width="32" height="60" rx="4" fill="#FC8181"/>
    <rect x="116" y="345" width="32" height="45" rx="4" fill="#FC8181"/>
    <rect x="176" y="335" width="32" height="55" rx="4" fill="#68D391"/>
    <rect x="236" y="325" width="32" height="65" rx="4" fill="#FC8181"/>
    <rect x="296" y="350" width="32" height="40" rx="4" fill="#68D391"/>
    <rect x="356" y="315" width="32" height="75" rx="4" fill="#FC8181"/>
    <rect x="416" y="320" width="32" height="70" rx="4" fill="#FC8181"/>
  </g>
  <!-- Text: StockExt -->
  <text x="256" y="460" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="56" fill="#fff" letter-spacing="4">StockExt</text>
  <!-- Subtle tagline -->
  <text x="256" y="498" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="400" font-size="18" fill="#fff" opacity="0.5" letter-spacing="6">A-SHARE MARKET TRACKER</text>
</svg>
