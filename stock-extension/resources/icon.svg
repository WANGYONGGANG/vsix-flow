<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- K-line candlestick icon -->
  <!-- Candle 1 (up) -->
  <rect x="1" y="4" width="2" height="5" rx="0.3" fill="currentColor"/>
  <line x1="2" y1="2.5" x2="2" y2="9.5" stroke="currentColor" stroke-width="0.6" stroke-linecap="round"/>
  <!-- Candle 2 (down) -->
  <rect x="4.5" y="5" width="2" height="5" rx="0.3" fill="currentColor"/>
  <line x1="5.5" y1="3.5" x2="5.5" y2="11" stroke="currentColor" stroke-width="0.6" stroke-linecap="round"/>
  <!-- Candle 3 (up) -->
  <rect x="8" y="3" width="2" height="6" rx="0.3" fill="currentColor"/>
  <line x1="9" y1="1.5" x2="9" y2="10" stroke="currentColor" stroke-width="0.6" stroke-linecap="round"/>
  <!-- Candle 4 (up) -->
  <rect x="11.5" y="4.5" width="2" height="4.5" rx="0.3" fill="currentColor"/>
  <line x1="12.5" y1="3" x2="12.5" y2="10" stroke="currentColor" stroke-width="0.6" stroke-linecap="round"/>
  <!-- Volume bars -->
  <rect x="1" y="11.5" width="2" height="2.5" rx="0.3" fill="currentColor" opacity="0.6"/>
  <rect x="4.5" y="11" width="2" height="3" rx="0.3" fill="currentColor" opacity="0.6"/>
  <rect x="8" y="11.5" width="2" height="2.5" rx="0.3" fill="currentColor" opacity="0.6"/>
  <rect x="11.5" y="11" width="2" height="3" rx="0.3" fill="currentColor" opacity="0.6"/>
  <!-- MA trend line -->
  <polyline points="2,7 5.5,8 9,5.5 12.5,6.5" fill="none" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
</svg>
