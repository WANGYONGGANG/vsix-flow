<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="up" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#F87171"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Rounded square background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- Subtle grid -->
  <g opacity="0.06" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="32" x2="128" y2="32"/><line x1="0" y1="64" x2="128" y2="64"/><line x1="0" y1="96" x2="128" y2="96"/>
    <line x1="32" y1="0" x2="32" y2="128"/><line x1="64" y1="0" x2="64" y2="128"/><line x1="96" y1="0" x2="96" y2="128"/>
  </g>
  <!-- Candlesticks (up trend) -->
  <rect x="18" y="48" width="10" height="36" rx="2" fill="url(#up)"/>
  <line x1="23" y1="34" x2="23" y2="90" stroke="#F87171" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="42" y="38" width="10" height="46" rx="2" fill="url(#up)"/>
  <line x1="47" y1="24" x2="47" y2="90" stroke="#F87171" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="66" y="28" width="10" height="56" rx="2" fill="url(#up)"/>
  <line x1="71" y1="14" x2="71" y2="90" stroke="#F87171" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Volume bars -->
  <rect x="18" y="100" width="10" height="14" rx="2" fill="#F87171" opacity="0.45"/>
  <rect x="42" y="96" width="10" height="18" rx="2" fill="#F87171" opacity="0.45"/>
  <rect x="66" y="92" width="10" height="22" rx="2" fill="#F87171" opacity="0.45"/>
  <!-- Rising arrow with glow -->
  <g filter="url(#glow)">
    <path d="M88 84 L100 44 L114 28 M100 44 L112 45 M100 44 L101 32"
      stroke="url(#arrow)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
