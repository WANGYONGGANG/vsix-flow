name = "fund-flow-proxy"
main = "worker.js"
compatibility_date = "2026-07-22"

# 静态资产配置：H5 页面
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Worker 先执行 /proxy 路径的请求，其他走静态资产
run_worker_first = ["/proxy/*", "/proxy"]

# 自定义域名
routes = [
  { pattern = "proxy.epcb.asia", custom_domain = true }
]