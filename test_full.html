<!DOCTYPE html><html><head></head><body><script nonce="US1QxSD3FNDsglu05GuZa1cMgImtZu1WCi2PAl9TanqeZV5JIp1pfMc0ntpoFy2G">
(function(){
var vscode=acquireVsCodeApi();
var TABS=[
  {id:'market_overview',label:'概况'},{id:'fundFlow',label:'资金'},{id:'em_news',label:'新闻'},
  {id:'sector_limit',label:'板块'},{id:'limit_leader',label:'龙头'},{id:'strong_sector',label:'强板'},
  {id:'dragon_tiger',label:'龙虎'},{id:'yesterday_limit',label:'涨停'},{id:'alert',label:'异动'},
  {id:'hot_stocks',label:'热股'},{id:'watchlist',label:'自选'},
];
var currentTab='market_overview';
function $(s){return document.querySelector(s)}
function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function renderTabs(){var bar=$('#tabBar');bar.innerHTML=TABS.map(function(t){return '<button class="tab-btn'+(t.id===currentTab?' active':'')+'" data-tab="'+t.id+'">'+t.label+'</button>'}).join('')}
$('#tabBar').addEventListener('click',function(e){
  var btn=e.target.closest('.tab-btn');
  if(btn){currentTab=btn.dataset.tab;renderTabs();$('#content').innerHTML='<div class="loading">加载中...</div>';vscode.postMessage({type:'switchTab',tab:currentTab})}
});
function renderMarket(d){
  if(!d||!d.indices){$('#content').innerHTML='<div class="loading">暂无数据</div>';return}
  var indices=d.indices;var html='<div class="grid-3">';
  indices.slice(0,3).forEach(function(i){var up=i.changeRate>=0;html+='<div class="card"><div class="text-muted mb-1">'+esc(i.name||'')+'</div><div class="'+(up?'text-up':'text-down')+'" style="font-size:18px;font-weight:700">'+i.price.toFixed(2)+'</div><div class="'+(up?'text-up':'text-down')+'">'+(i.changeRate>=0?'+':'')+i.changeRate.toFixed(2)+'%</div></div>'});
  html+='</div>';
  if(indices.length>3){html+='<div class="card"><div class="text-muted mb-1">指数对比</div>';indices.forEach(function(i){var up=i.changeRate>=0;html+='<div class="flex items-center gap-2 mb-1"><span class="text-muted" style="width:50px">'+esc(i.name||'')+'</span><span class="'+(up?'text-up':'text-down')+'" style="flex:1">'+(i.changeRate>=0?'+':'')+i.changeRate.toFixed(2)+'%</span></div>'});html+='</div>'}
  $('#content').innerHTML=html
}
function renderNews(d){var list=d&&d.news?d.news:(d||[]);if(!list.length){$('#content').innerHTML='<div class="loading">暂无新闻</div>';return}$('#content').innerHTML=list.map(function(n){return '<div class="card" style="cursor:pointer" onclick="vscode.postMessage({type:'openUrl',url:''+esc(n.url||'')+''})"><div class="text-muted mb-1">'+esc(n.time)+'</div><div style="font-weight:500">'+esc(n.title)+'</div></div>'}).join('')}
function renderSector(d){
  var list=d&&d.data?d.data.diff:(d||[]);if(!list.length){$('#content').innerHTML='<div class="loading">暂无数据</div>';return}
  var sorted=list.slice().sort(function(a,b){return (b.f3||0)-(a.f3||0)});
  $('#content').innerHTML='<table><tr><th>板块</th><th>涨跌幅</th><th>上涨/下跌</th></tr>'+sorted.map(function(d){return '<tr><td>'+esc(d.f14||'')+'</td><td class="'+(d.f3>=0?'text-up':'text-down')+'">'+(d.f3>=0?'+':'')+(d.f3||0).toFixed(2)+'%</td><td><span class="text-up">'+(d.f104||0)+'</span>/<span class="text-down">'+(d.f105||0)+'</span></td></tr>'}).join('')+'</table>'
}
function renderLeader(d){
  var list=d&&d.data?d.data.diff:(d||[]);if(!list.length){$('#content').innerHTML='<div class="loading">暂无数据</div>';return}
  var sorted=list.slice().filter(function(x){return x.f3>9}).sort(function(a,b){return (b.f3||0)-(a.f3||0)});
  $('#content').innerHTML='<table><tr><th>代码</th><th>名称</th><th>涨幅</th><th>连板</th></tr>'+sorted.slice(0,30).map(function(d){return '<tr><td>'+esc(d.f12||'')+'</td><td>'+esc(d.f14||'')+'</td><td class="text-up">+'+(d.f3||0).toFixed(2)+'%</td><td>'+(d.f187||1)+'</td></tr>'}).join('')+'</table>'
}
function renderHot(d){
  var list=d&&d.data?d.data.diff:(d||[]);if(!list.length){$('#content').innerHTML='<div class="loading">暂无数据</div>';return}
  $('#content').innerHTML='<table><tr><th>代码</th><th>名称</th><th>最新价</th><th>涨跌幅</th></tr>'+list.slice(0,30).map(function(d){return '<tr><td>'+esc(d.f12||'')+'</td><td>'+esc(d.f14||'')+'</td><td>'+(d.f2||0).toFixed(2)+'</td><td class="'+(d.f3>=0?'text-up':'text-down')+'">'+(d.f3>=0?'+':'')+(d.f3||0).toFixed(2)+'%</td></tr>'}).join('')+'</table>'
}
renderTabs();$('#content').innerHTML='<div class="loading">加载中...</div>';
vscode.postMessage({type:'switchTab',tab:'market_overview'});
window.addEventListener('message',function(e){
  var msg=e.data;
  if(msg.type==='tabData'&&msg.tab===currentTab){
    if(msg.tab==='market_overview')renderMarket(msg.data);
    else if(msg.tab==='em_news')renderNews(msg.data);
    else if(msg.tab==='sector_limit')renderSector(msg.data);
    else if(msg.tab==='limit_leader')renderLeader(msg.data);
    else if(msg.tab==='hot_stocks')renderHot(msg.data);
    else $('#content').innerHTML='<div class="loading">开发中...</div>'
  }
});
})();
</script></body></html>
